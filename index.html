<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FluxCode</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="orb o1"></div><div class="orb o2"></div>
<header class="topbar"><div class="traffic"><i></i><i></i><i></i></div><div class="brand"><span class="brandmark">⌘</span><span>FluxCode</span><small>0.1</small></div><div class="top-actions"><button id="githubBtn">Connect GitHub</button><button id="cloudBtn">Cloudflare</button><button class="run" id="runBtn">▶ Run</button></div></header>
<main class="app">
<aside class="sidebar"><div class="side-title">WORKSPACE</div><button class="nav active" data-panel="explorer">⌂ <span>Explorer</span></button><button class="nav" data-panel="github">◈ <span>GitHub</span></button><button class="nav" data-panel="cloud">☁ <span>Cloudflare</span></button><button class="nav" data-panel="preview">◉ <span>Live Preview</span></button><div class="side-bottom"><button class="nav">⚙ <span>Settings</span></button></div></aside>
<section class="workspace"><div class="projectbar"><div><strong id="projectName">Untitled Project</strong><span id="repoStatus">Local workspace</span></div><div class="tabs"><button class="tab active">index.html</button><button class="tab">+</button></div></div>
<div class="editor-wrap"><aside class="files"><div class="files-head">FILES <button id="newFile">+</button></div><button class="file active" data-file="index.html">◇ index.html</button><button class="file" data-file="style.css">◇ style.css</button><button class="file" data-file="app.js">◇ app.js</button></aside>
<div class="editor"><div class="editor-head"><span id="fileName">index.html</span><span>HTML</span></div><div class="code" id="code"></div></div>
<section class="preview"><div class="preview-head"><span>LIVE PREVIEW</span><button id="refresh">↻</button></div><iframe id="frame" sandbox="allow-scripts"></iframe></section></div>
<div class="terminal"><div class="term-head"><span>TERMINAL</span><span class="ok">● Ready</span></div><pre id="terminal">FluxCode workspace ready.\n$ Select Run to preview your project.\n</pre></div></section>
</main>
<div class="modal hidden" id="modal"><div class="modal-card"><button class="close" id="close">×</button><div id="modalBody"></div></div></div>
<script src="app.js"></script></body></html>
