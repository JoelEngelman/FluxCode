<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FluxCode</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="orb o1"></div><div class="orb o2"></div>
<header class="topbar"><div class="traffic"><button class="traffic-dot red" id="winClose" aria-label="Close"></button><button class="traffic-dot yellow" id="winMin" aria-label="Minimize"></button><button class="traffic-dot green" id="winMax" aria-label="Maximize"></button></div><div class="brand"><span class="brandmark">⌘</span><span>FluxCode</span><small id="appVersion">0.1</small></div><div class="top-actions"><button id="newProjectBtn">＋ New Project</button><button id="learnFluxBtn">⚡ Learn Flux</button><button id="githubBtn">Connect GitHub</button><button id="cloudBtn">Cloudflare</button><button class="run" id="runBtn">▶ Run</button></div></header>
<main class="app"><aside class="sidebar"><div class="side-title">WORKSPACE</div><button class="nav active" data-panel="explorer">⌂ <span>Explorer</span></button><button class="nav" data-panel="github">◈ <span>GitHub</span></button><button class="nav" data-panel="cloud">☁ <span>Cloudflare</span></button><button class="nav" data-panel="preview">◉ <span>Live Preview</span></button><button class="nav" id="learnFluxSide">⚡ <span>Learn Flux</span></button><div class="side-bottom"><button class="nav" data-panel="settings">⚙ <span>Settings</span></button></div></aside>
<section class="workspace"><div class="projectbar"><div><strong id="projectName">Untitled Project</strong><span id="repoStatus">Local workspace</span></div><div class="tabs"><button class="tab active" id="activeTab">index.html</button><button class="tab" id="newTab">+</button></div></div>
<div class="editor-wrap"><aside class="files"><div class="files-head">FILES <button id="newFile">+</button></div><div id="fileList"></div></aside><div class="editor"><div class="editor-head"><span id="fileName">index.html</span><span id="languageLabel">HTML</span></div><div class="code" id="code"></div></div><section class="preview"><div class="preview-head"><span>LIVE PREVIEW</span><button id="refresh">↻</button></div><iframe id="frame" sandbox="allow-scripts"></iframe></section></div><div class="terminal"><div class="term-head"><span>TERMINAL</span><span class="ok">● Ready</span></div><pre id="terminal">FluxCode workspace ready.\n$ Create a project or open a repository to begin.\n</pre></div></section></main>
<div class="modal hidden" id="modal"><div class="modal-card"><button class="close" id="close">×</button><div id="modalBody"></div></div></div><script src="flux.js"></script><script src="app.js"></script><script src="flux-preview.js"></script></body></html>
